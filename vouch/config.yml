vouch:
  domains:
    - ucsf.edu

  cookie:
    secure: true
    domain: pocr-app.ucsf.edu
    name: VouchCookie

  headers:
    claims:
      - name
      - email
      - picture

  # allowAllUsers: true
  # whiteList:
  #  - you@gmail.com

oauth:
  provider: google
  # `client_id` and `client_secret` set on server only
  client_id:
  client_secret:
  callback_urls:
    - https://pocr-app.ucsf.edu/auth

  scopes:
    - openid
    - email
    - profile

