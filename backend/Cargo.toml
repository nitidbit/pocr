[workspace]
resolver = "3"
members = ["apps/engine", "apps/migrate", "apps/sync", "crates/api-grpc", "crates/api-http", "crates/core", "crates/infra-caboodle", "crates/infra-pg", "crates/infra-redis", "crates/observability"]

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
chrono = { version = "0.4.43", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v7", "serde"] }
quick-xml = { version = "0.40.0", features = ["serialize"] }
axum = "0.8.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "macros", "postgres", "uuid", "chrono"] }
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
tracing-error = "0.2.1"
tracing-appender = "0.2.4"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace"] }
redis = { version = "1.2.1", features = ["aio", "tokio-comp"] }
serde_json = "1.0.140"
rand = "0.10.1"
tonic = "0.14.6"
prost = "0.14.3"
jsonwebtoken = "10.4.0"
futures = "0.3.31"
dashmap = "6.1.0"
x509-parser = "0.17"
pem = "3"
secrecy = "0.10.3"
tiberius = { version = "0.12", default-features = false, features = ["chrono", "tds73", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }
sha2 = "0.10"
derive_more = { version = "2.1.1", features = ["as_ref", "display", "into"] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Selected `restriction`/`nursery` lints
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# Conflicts with structured-logging templates (M-LOG-STRUCTURED)
literal_string_with_formatting_args = "allow"
