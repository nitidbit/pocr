# Who may call the CDS Hooks endpoints (/cds-services). Included from
# templates/app.conf.template.
#
# The engine does not yet verify Epic's signed request token (see
# docs/security-concerns.md S2), so on a real install restrict this to your
# Epic Interconnect servers' addresses, for example:
#
#   allow 10.20.30.40;      # Interconnect PRD
#   allow 10.20.31.0/24;    # Interconnect non-prod pool
#   deny  all;
#
# Edit on the host, then `docker compose restart nginx`.
allow all;
