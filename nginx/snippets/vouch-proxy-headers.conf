proxy_set_header X-Vouch-Given-Name  $auth_resp_x_vouch_idp_claims_given_name;
proxy_set_header X-Vouch-Picture     $auth_resp_x_vouch_idp_claims_picture;
proxy_set_header X-Vouch-Groups      $auth_resp_x_vouch_idp_claims_groups;
