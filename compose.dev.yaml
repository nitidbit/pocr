services:
  app:
    build:
      context: ./frontend
      target: development
    depends_on:
      - engine
    environment:
      VITE_PROXY_TARGET: http://engine:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5179:5179"

  engine:
    build:
      context: ./backend
      target: development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pocr:pocr@postgres:5432/pocr
      REDIS_URL: redis://redis:6379
      RUST_LOG: info,sqlx=warn,hyper=warn,tower_http=trace
      # Which CDS Hooks fhirServer URLs may randomize, and into which
      # environment. The default admits the public CDS Hooks sandbox
      # (sandbox.cds-hooks.org, whose FHIR server is launch.smarthealthit.org)
      # and the local fake-Epic script, both as non-production.
      FHIR_ENV_MAP: ${FHIR_ENV_MAP:-https://launch.smarthealthit.org/=nonproduction;https://fake-epic.localhost/=nonproduction}
      # Let the public CDS Hooks sandbox (a browser app) call this engine, and
      # list each open study as its own service so the sandbox can pick one.
      # Both are off unless set; see docs/security-concerns.md S3/S4.
      CDS_CORS_ORIGINS: ${CDS_CORS_ORIGINS:-https://sandbox.cds-hooks.org}
      CDS_DISCOVERY_LIST_STUDIES: ${CDS_DISCOVERY_LIST_STUDIES:-true}
    volumes:
      - ./backend:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    ports:
      - "3000:3000"
      - "50051:50051"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pocr
      POSTGRES_PASSWORD: pocr
      POSTGRES_DB: pocr
    volumes:
      # PG18+ images store data in a version-specific subdir; mount the parent
      # (not .../data) per docker-library/postgres#1259 to avoid the
      # "unused mount/volume" refusal.
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    volumes:
      - redis_data:/data
    ports:
      # host 6380 to dodge local redis-server / other stacks; in-network stays 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  cargo_registry:
  cargo_git:
  cargo_target:
