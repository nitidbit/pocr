services:
  app:
    build:
      context: ./frontend
      target: development
    depends_on:
      - engine
    environment:
      VITE_PROXY_TARGET: http://engine:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5179:5179"

  engine:
    build:
      context: ./backend
      target: development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pocr:pocr@postgres:5432/pocr
      REDIS_URL: redis://redis:6379
      RUST_LOG: info,sqlx=warn,hyper=warn,tower_http=trace
    volumes:
      - ./backend:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    ports:
      - "3000:3000"
      - "50051:50051"

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: pocr
      POSTGRES_PASSWORD: pocr
      POSTGRES_DB: pocr
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine@sha256:223b183cbc49f5ff48728e1fc52ccf101f05072decad2bd9867281a3c9bf75fd
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  cargo_registry:
  cargo_git:
  cargo_target:
