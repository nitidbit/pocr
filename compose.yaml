services:
  nginx:
    # Stock nginx; all config is bind-mounted from the host (see volumes below),
    # so no custom image/build is needed. The base entrypoint runs envsubst on
    # /etc/nginx/templates/*.template at startup.
    image: nginx:1.31-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      engine:
        condition: service_healthy
      vouch:
        condition: service_started
    environment:
      NGINX_SERVER_PORT: ${NGINX_SERVER_PORT:-443}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-pocr-app.ucsf.edu}
      NGINX_GRPC_PORT: ${NGINX_GRPC_PORT:-1443}
    volumes:
      - ./certs:/etc/nginx/certs:ro
      # Config is host-local (like certs/vouch/secrets): edit on the host and
      # `docker compose restart nginx` — no image rebuild. Templates are
      # processed by envsubst at container start into /etc/nginx/conf.d/.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "443:443"
      - "1443:1443"
    networks:
      - frontend
      - backend

  vouch:
    image: quay.io/vouch/vouch-proxy:latest
    restart: unless-stopped
    volumes:
      - ./vouch/config.yml:/config/config.yml:ro
    environment:
      VOUCH_CONFIG: /config/config.yml
    networks:
      - frontend
    expose:
      - "9090"

  app:
    build:
      context: ./frontend
    image: andrewdrobinson/ucsf:pocr-app
    restart: unless-stopped
    depends_on:
      - engine
    networks:
      - frontend
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  engine:
    build:
      context: ./backend
      target: production
    image: andrewdrobinson/ucsf:pocr-engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      RUST_LOG: info
      CERT_PATH: /etc/certs/ssl.pem
      # Maps CDS Hooks fhirServer URL prefixes → environments. Not a secret (just
      # URL→env-name pairs), but site-specific, so sourced from .env rather than
      # committed here. Unset/empty fails closed (all randomization rejected).
      FHIR_ENV_MAP: ${FHIR_ENV_MAP:?set FHIR_ENV_MAP in .env}
      # The engine reads JWT_SECRET as a plain env var (no _FILE variant). Source
      # it from the host secret file so it is not committed or shown on the CLI.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env from secrets/jwt_secret}
    volumes:
      - ./certs:/etc/certs:ro
    secrets:
      - database_url
      - redis_url
    networks:
      - backend
    expose:
      - "3000"
      - "50051"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:3000/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot tools (pocr-migrate / pocr-sync). Never started by `up` or pulled
  # by `pull` — guarded behind the "tools" profile. Uses the engine image, which
  # ships all three binaries. Attached to BOTH networks: `backend` for POCR
  # postgres/redis (internal), `frontend` + host-gateway for egress to the
  # legacy Redis running on the host.
  migrate:
    image: andrewdrobinson/ucsf:pocr-engine
    profiles: ["tools"]
    entrypoint: ["pocr-migrate"]
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
    # DATABASE_URL, POCR_REDIS_URL, LEGACY_REDIS_URL (and CABOODLE_* for sync) are
    # supplied at runtime via `docker compose run -e ...` — pocr-migrate/pocr-sync
    # read these directly (not the *_FILE secrets the engine uses).
    #
    # Joined to satellite_backend (the legacy stack's network) so it can reach the
    # legacy Redis, which publishes no host port. NOTE: both networks expose a
    # service aliased `redis`; address every endpoint by container name
    # (pocr-redis-1 / pocr-postgres-1 / satellite-redis-1), never the bare alias.
    networks:
      - backend
      - satellite_backend

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocr
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pocr
    secrets:
      - postgres_password
    networks:
      - backend
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./redis
    image: andrewdrobinson/ucsf:pocr-redis
    restart: unless-stopped
    secrets:
      - redis_password
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
  backend:
    internal: true
  # Legacy satellite stack's network, used only by the profiled `migrate` service
  # to reach the legacy Redis during migration. Declared external so compose joins
  # the existing network rather than creating one.
  satellite_backend:
    external: true

volumes:
  pg_data:
  redis_data:

# The engine reads full connection URLs (with embedded credentials) from
# database_url / redis_url. postgres and redis read their bare passwords from
# postgres_password / redis_password. The password in each *_url file MUST match
# its corresponding *_password file — the operator's secret-generation step is
# responsible for keeping them in sync.
secrets:
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  redis_password:
    file: ./secrets/redis_password
  postgres_password:
    file: ./secrets/postgres_password
