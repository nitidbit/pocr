<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="POCR — UCSF Point of Care Randomization Engine">
  <rect width="512" height="512" rx="112" fill="#052049"/>
  <!-- Randomization fork: a single point of care splitting into two trial arms -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- stem -->
    <path d="M256 376 V300" stroke="#FFFFFF" stroke-width="28"/>
    <!-- left arm (teal) -->
    <path d="M256 300 C256 240 168 236 148 176" stroke="#18A3AC" stroke-width="28"/>
    <!-- right arm (white) -->
    <path d="M256 300 C256 240 344 236 364 176" stroke="#FFFFFF" stroke-width="28"/>
  </g>
  <!-- point of care node -->
  <circle cx="256" cy="392" r="34" fill="#18A3AC"/>
  <!-- allocation endpoints -->
  <circle cx="140" cy="150" r="30" fill="#18A3AC"/>
  <circle cx="372" cy="150" r="30" fill="#FFFFFF"/>
</svg>
